# NOTE: Cargo の package 名は数字始まり不可。
# 2ch(にちゃんねる)由来で 5ch = ご(5)ちゃんねる → "goch-viewer"。
# ディレクトリ名は 5ch-viewer のまま。
[package]
name = "goch-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
reqwest = { version = "0.12", features = ["cookies", "stream"] }
futures-util = "0.3"
cookie_store = "0.22"
cookie = "0.18"
time = { version = "0.3", features = ["std"] }
url = "2"
ammonia = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
tower-http = { version = "0.6", features = ["fs", "trace"] }
regex-lite = "0.1"
encoding_rs = "0.8"
urlencoding = "2"
scraper = "0.21"

[lints.clippy]
all = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
