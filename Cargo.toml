# NOTE: Cargo の package 名は数字始まり不可なので "viewer-of-5ch" としている。
# Rust 識別子としては viewer_of_5ch となり有効。
[package]
name = "viewer-of-5ch"
version = "0.4.6"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled"] }
reqwest = { version = "0.12", features = ["cookies", "stream"] }
futures-util = "0.3"
cookie_store = "0.22"
cookie = "0.18"
time = { version = "0.3", features = ["std"] }
url = "2"
ammonia = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
tower-http = { version = "0.6", features = ["fs", "trace"] }
regex-lite = "0.1"
encoding_rs = "0.8"
libc = "0.2"
urlencoding = "2"
scraper = "0.21"
quick-xml = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[lints.clippy]
all = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
