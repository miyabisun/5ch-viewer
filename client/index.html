<!doctype html>
<html lang="ja">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Relative href: resolves against the injected <base>, so it works under a base_path deploy too. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Cloudflare Access guards the site, and a manifest fetch omits cookies unless asked. -->
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <!-- Installed app on Android Chrome: the system buttons sit over the window background,
         fixed at install from the manifest background_color, and take their contrast from
         theme-color. Keep both on Sumi (--surface, dark) whatever the page theme. This must
         precede the page-mirroring meta that lib/theme.js appends, so it wins there. -->
    <meta name="theme-color" media="(display-mode: standalone)" content="#191919" />
    <title>viewer-of-5ch</title>
    <script>
      window.__BASE_PATH__ = ""
    </script>
    <!-- Apply theme before first paint to avoid FOUC. Mirrors lib/theme.js (key/resolve). -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('5ch-theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
